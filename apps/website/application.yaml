apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: tenants-rpp
spec:
  project: rpp
  destination:
    server: https://kubernetes.default.svc
    namespace: rpp-website
  sources:
    # Chart and image from the same commit: targetRevision is its full hash, image.tag its first 7 characters.
    - repoURL: https://github.com/RocketPadPlatforms/rpp-website.git
      targetRevision: 2e918a0d6446c5782a4af0c4226d5b2069ac8e6b
      path: chart
      helm:
        releaseName: website
        valueFiles: [$values/apps/website/values.yaml]
        parameters:
          - {name: image.tag, value: "2e918a0", forceString: true}
    - repoURL: https://github.com/RocketPadPlatforms/rpp-tenant.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    # The first sync can be forbidden for a moment, until the platform grants the new namespace.
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
